<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sovereign Blog Archive</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        
        /* Accordion Styling */
        details {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 10px;
            transition: all 0.3s ease;
        }
        details[open] {
            background: #fff;
            border-color: #aaa;
        }
        summary {
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            list-style: none; /* Removes default arrow in some browsers */
        }
        summary::before {
            content: "▶ ";
            color: #666;
        }
        details[open] summary::before {
            content: "▼ ";
        }
        
        /* Markdown Content Styling inside accordion */
        .post-content { padding: 15px 20px; border-top: 1px solid #eee; margin-top: 10px; }
        h1, h2, h3 { margin-top: 0; color: #222; }
        .error-msg { color: #d9534f; }
    </style>
</head>
<body>

    <header>
        <h1>Blog Archive</h1>
        <hr>
    </header>

    <div id="blog-accordion-container"></div>

    <script>
        /**
         * Renders multiple Markdown files into an accordion format
         * @param {Array} posts - Array of objects { title: string, file: string }
         * @param {string} containerId - The ID of the element to fill
         */
        async function loadArchive(posts, containerId) {
            const container = document.getElementById(containerId);

            for (const post of posts) {
                // Create the accordion elements
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                const contentDiv = document.createElement('div');
                
                summary.textContent = post.title;
                contentDiv.className = 'post-content';
                contentDiv.innerHTML = '<em>Loading...</em>';
                
                details.appendChild(summary);
                details.appendChild(contentDiv);
                container.appendChild(details);

                // Fetch and parse the markdown
                try {
                    const response = await fetch(post.file);
                    if (!response.ok) throw new Error(`Could not load ${post.file}`);
                    
                    let text = await response.text();

                    // --- Parser Logic ---
                    text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                    text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                    text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');
                    text = text.replace(/^- (.*$)/gim, '<li>$1</li>');
                    text = text.replace(/(<li>(?:.|\n)*?<\/li>)/gim, '<ul>$1</ul>');
                    text = text.replace(/<\/ul>\s*<ul>/gim, '');
                    text = text.replace(/\n\n/g, '<br><br>');

                    contentDiv.innerHTML = text;
                } catch (err) {
                    contentDiv.innerHTML = `<p class="error-msg">Error: ${err.message}</p>`;
                }
            }
        }

        // --- Configuration ---
        // Add your posts here!
        const myPosts = [
            { title: "Digital Sovereignty in Europe", file: "md/digital-sovereignty.md" }
        ];

        // Run the loader
        loadArchive(myPosts, 'blog-accordion-container');
    </script>

</body>
</html>
