<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A view from the Rock | Blog</title>
    <style>
        /* Shared variables for that clean Apple/Business look */
        :root {
            --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --nav-bg: #2d3436; /* Darker tone matching your site's feel */
        }

        body {
            font-family: var(--system-font);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header & Navigation (Integrated from peter.nz) --- */
        nav {
            background-color: var(--nav-bg);
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            font-size: 16px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .site-header {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .site-header h1 {
            font-size: 42px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.015em;
        }

        .site-header .subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            margin-top: 10px;
            font-weight: 400;
        }

        /* --- Content Container --- */
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* --- Accordion Styles --- */
        #blog-accordion-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        details {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        details[open] {
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        summary {
            padding: 24px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
        }

        summary::after {
            content: '+';
            font-size: 24px;
            color: var(--accent);
            transition: transform 0.3s ease;
        }

        details[open] summary::after {
            transform: rotate(45deg);
        }

        /* --- Markdown Content Area --- */
        .post-content {
            padding: 0 24px 32px 24px;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .post-content h1, .post-content h2, .post-content h3 { color: #000; margin-top: 1.2em; }
        .post-content ul { padding-left: 20px; }
        .post-content li { margin-bottom: 10px; }
        
        .error-msg { color: #d63031; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <a href="/">Home</a>
        <a href="/gforcex/index.html">GForce-X</a>
        <a href="/lunar-lander/index.html">Lunar Lander</a>
        <a href="/maze-runner/index.html">Maze Runner</a>
    </nav>

    <header class="site-header">
        <h1>A view from the Rock</h1>
        <div class="subtitle">Rock's blog on Issues of the Digital Age</div>
    </header>

    <div class="container">
        <div id="blog-accordion-container">
            </div>
    </div>

    <script>
        /**
         * Renders Markdown posts into the accordion
         */
        async function loadBlogArchive(posts, containerId) {
            const container = document.getElementById(containerId);

            for (const post of posts) {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                const contentDiv = document.createElement('div');
                
                summary.textContent = post.title;
                contentDiv.className = 'post-content';
                contentDiv.innerHTML = '<em>Loading insight...</em>';
                
                details.appendChild(summary);
                details.appendChild(contentDiv);
                container.appendChild(details);

                try {
                    const response = await fetch(post.file);
                    if (!response.ok) throw new Error(`File not found: ${post.file}`);
                    
                    let text = await response.text();

                    // Basic Markdown Parser Logic
                    text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                    text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                    text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');
                    text = text.replace(/^- (.*$)/gim, '<li>$1</li>');
                    text = text.replace(/(<li>(?:.|\n)*?<\/li>)/gim, '<ul>$1</ul>');
                    text = text.replace(/<\/ul>\s*<ul>/gim, '');
                    text = text.replace(/\n\n/g, '<br><br>');

                    contentDiv.innerHTML = text;
                } catch (err) {
                    contentDiv.innerHTML = `<p class="error-msg">Error: ${err.message}</p>`;
                }
            }
        }

        // --- Configuration: Add your .md files here ---
        const myPosts = [
            { title: "Digital Sovereignty in Europe", file: "md/digital-sovereignty.md" },
            { title: "LLMs are a Dead end", file: "md/llms-are-dead.html" },
        ];

        loadBlogArchive(myPosts, 'blog-accordion-container');
    </script>

</body>
</html>
