<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sovereign Blog</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        /* Simple styling for your generated elements */
        #blog-container { border-top: 2px solid #eee; padding-top: 20px; }
        h1 { color: #000; }
        h2 { color: #444; border-bottom: 1px solid #eee; }
        li { margin-bottom: 8px; }
        .error-msg { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>A View from the Rock</h1>
        <p>Exploring issues of the digital age.</p>
    </header>

    <main id="blog-1">
        <p><em>Loading the latest post...</em></p>
    </main>

    <script>
        /**
         * Fetches Markdown, parses basic syntax, and injects into a specific element
         * @param {string} filePath - Path to the .md file
         * @param {string} containerId - The ID of the HTML element to fill
         */
        async function renderMarkdown(filePath, containerId) {
            const container = document.getElementById(containerId);
            
            if (!container) {
                console.error(`Target container #${containerId} not found.`);
                return;
            }

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Could not find ${filePath}`);
                
                let text = await response.text();

                // --- Simple Parser Logic ---
                
                // Headers (Order matters: check 3 hashes before 1 hash)
                text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');

                // Hyphen list items
                text = text.replace(/^- (.*$)/gim, '<li>$1</li>');

                // Wrap lists: Find groups of <li> and wrap in <ul>
                text = text.replace(/(<li>(?:.|\n)*?<\/li>)/gim, '<ul>$1</ul>');
                // Clean up accidental nested <ul> if multiple items exist
                text = text.replace(/<\/ul>\s*<ul>/gim, '');

                // Double line breaks to paragraphs
                text = text.replace(/\n\n/g, '<br><br>');

                // Injecting the result
                container.innerHTML = text;

            } catch (err) {
                container.innerHTML = `<p class="error-msg">Error loading blog: ${err.message}</p>`;
            }
        }

        // Initialize the loader
        // You can now target ANY id on your page:
        renderMarkdown('md/digital-sovereignity.md', 'blog-1');
    </script>

</body>
</html>
