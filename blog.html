<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A view from the Rock - blog</title>
    <style>
        /* Apple-style CSS Reset & Variables */
        :root {
            --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
        }

        body {
            font-family: var(--system-font);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.003em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 21px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* The Accordion (Details) */
        #blog-accordion-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        details {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        details[open] {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-color: transparent;
        }

        summary {
            padding: 24px;
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
        }

        /* Custom Arrow */
        summary::after {
            content: '+';
            font-size: 24px;
            font-weight: 300;
            color: var(--accent);
            transition: transform 0.3s ease;
        }

        details[open] summary::after {
            transform: rotate(45deg);
        }

        /* Markdown Content Styling */
        .post-content {
            padding: 0 24px 32px 24px;
            font-size: 17px;
            color: #424245;
        }

        .post-content h1, .post-content h2, .post-content h3 {
            color: var(--text-main);
            margin-top: 1.5em;
        }

        .post-content h2 { font-size: 24px; font-weight: 600; }
        .post-content h3 { font-size: 20px; font-weight: 600; }

        .post-content li {
            margin-bottom: 12px;
            padding-left: 5px;
        }

        .post-content ul {
            padding-left: 20px;
            list-style-type: disc;
        }

        /* Subtle scroll behavior */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>A View from the Rock</h1>
            <p>Rock's blog of Issues in the Digital Age.</p>
        </header>

        <div id="blog-accordion-container">
            </div>
    </div>

    <script>
        async function loadArchive(posts, containerId) {
            const container = document.getElementById(containerId);

            for (const post of posts) {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                const contentDiv = document.createElement('div');
                
                summary.textContent = post.title;
                contentDiv.className = 'post-content';
                contentDiv.innerHTML = '<em>Loading...</em>';
                
                details.appendChild(summary);
                details.appendChild(contentDiv);
                container.appendChild(details);

                try {
                    const response = await fetch(post.file);
                    if (!response.ok) throw new Error(`Could not load ${post.file}`);
                    
                    let text = await response.text();

                    // Parser Logic
                    text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                    text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                    text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');
                    text = text.replace(/^- (.*$)/gim, '<li>$1</li>');
                    text = text.replace(/(<li>(?:.|\n)*?<\/li>)/gim, '<ul>$1</ul>');
                    text = text.replace(/<\/ul>\s*<ul>/gim, '');
                    text = text.replace(/\n\n/g, '<br><br>');

                    contentDiv.innerHTML = text;
                } catch (err) {
                    contentDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
                }
            }
        }

        const myPosts = [
            { title: "Digital Sovereignty in Europe", file: "md/digital-sovereignty.md" },
        ];

        loadArchive(myPosts, 'blog-accordion-container');
    </script>

</body>
</html>
